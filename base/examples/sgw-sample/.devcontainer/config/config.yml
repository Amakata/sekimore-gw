# Sekimore Gateway - AI Agent Security Gateway
# Sample Configuration for sgw-sample
#
# This file is the whole menu. Every key the gateway reads appears here: the ones this sample
# sets, and the rest commented out with their default and a line on why you would change one.
# Copy it into your project and delete what you do not need.
#
# The file sits in the worktree, so the dev container can write it. `reload:` below decides when
# a change to it is applied - see that key before you hand work to an agent.

name: SGW Example | Sekimore
description: SGW Example

# Allowed Domain List
# Wildcard notation: ".example.com" allows "*.example.com", "*.*.example.com", etc.
# Anything not listed gets no DNS answer, so a new dependency host is added here.
allow_domains:
  # AI
  - storage.googleapis.com
  - platform.claude.com
  - api.anthropic.com
  # debian
  - deb.debian.org
  # github
  - github.com
  - codeload.github.com                  # where github.com/<org>/<repo>/archive/... redirects: source tarballs
  - api.github.com
  - raw.githubusercontent.com
  - release-assets.githubusercontent.com
  # vscode
  - main.vscode-cdn.net
  - www.vscode-unpkg.net
  - marketplace.visualstudio.com
  - packages.microsoft.com
  # docker
  - registry-1.docker.io
  - auth.docker.io
  - docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com
  - production.cloudflare.docker.com
  # python
  - www.python.org
  - pypi.org
  - .pythonhosted.org
  # nodejs
  - npmjs.com
  - nodejs.org
  - .npmjs.org
  # docker compose service names
  - sekimore-gw
  - dev

# Ignored Domain List (hidden from UI dashboard, but DNS resolves normally)
# Use it for noisy harmless domains - telemetry, health checks.
ignore_domains: []

# Blocked Domain List. Checked before the allow list, so it wins over a wildcard above.
block_domains: []

# Allowed IP List (direct access, with no DNS answer needed)
# Do NOT include external DNS servers (e.g. 8.8.8.8): an agent could resolve anything through one
# and the DNS filter would never see it. The addresses behind allow_domains are allowed
# automatically, as the resolution results, so this list is for hosts that have no name.
allow_ips: []

# Blocked IP List
block_ips: []

# Proxy Configuration (HTTP/HTTPS proxy)
#
# `enabled` runs Squid inside the gateway. Turning it off stops Squid, its cache and its access
# log - DNS filtering, the firewall and the relay are separate and keep working without it.
#
# `upstream_proxy` is a different decision: it sends Squid's traffic, and the relay's own requests
# (the device flow, the GitHub API), through a corporate proxy. Set it only where one is required.
# It is read only while `enabled` is true, and a proxy that does not answer makes `gw:login` time
# out, which reads like the upstream being unreachable.
#
# A domain listed under `domain_handlers` as github / https-relay / deny is refused by Squid
# automatically. Squid resolves names through Docker's DNS and so never sees the DNS filter's
# answers; served here, a relayed domain would stay reachable through `https_proxy=<gateway>:3128`
# and skip the relay's policy.
proxy:
  enabled: false                          # run Squid (not: enable upstream proxying - see above)
  port: 3128                              # proxy port
  cache_enabled: true                     # cache responses
  cache_size_mb: 1000                     # cache size (MB)
  upstream_proxy: proxy.example.com:3128  # corporate proxy, "host:port". Ignored while enabled is false
  # upstream_proxy_tls: false             # default false. TLS on the hop to the upstream proxy itself
  #
  # gw 0.2.22: the credential belongs in the secret store, not here and not in the environment:
  #   mise run gw:proxy-credential -- set
  # Written here it is readable from the dev container, because this file is in the worktree. The
  # environment is not the answer either: `.devcontainer/.env` is the dev service's own env_file,
  # so anything in it becomes a variable in the agent's own process. Both are still read, so an
  # existing deployment keeps working. The store is sealed at start-up, so Squid runs without
  # upstream authentication until `mise run gw:unlock`.
  upstream_proxy_username: null           # prefer `mise run gw:proxy-credential -- set`
  upstream_proxy_password: null           # readable from dev if set here

# Web UI language (gw 0.2.4+). auto = follow the browser's Accept-Language; a choice made in the
# UI is remembered in a cookie and wins over this. Set en or ja to pin it.
# CLI tools follow the environment instead: SEKIMORE_LANG / LC_ALL / LC_MESSAGES / LANG (default en).
# ui:
#   language: auto

# Network Configuration
# DNS itself has no settings: upstream is Docker's embedded resolver (127.0.0.11) on port 53 with
# a 60-86400 s TTL clamp, fixed so that it cannot be pointed somewhere that breaks Squid.
network:
  # allowed_ports: [80, 443]     # gw 0.2.2+ destination TCP ports allowed towards the allowed domains
                                 # and IPs. Empty (the default) means every port, as before; restricting
                                 # it closes routes that leave over another protocol. Applied on restart
  lan_subnets: []                # informational: the gateway detects its networks through the Docker API

# Database Path
database_path: "/data/security_gateway.db"

# ---- sekimore-relay: git / GitHub API relay (docker-compose.relay.yml) ----
# `git@github.com:Org/Repo.git` from dev is answered by the relay inside sekimore-gw
# (DNS points github.com at the gateway), checked against this project policy and
# forwarded upstream with the operator's ssh-agent. Remove this block (and the overlay
# from devcontainer.json) to run without the relay.
# When a change to this file takes effect (gw 0.2.13+). The file is writable from the dev
# container and `auto` applies it on save, so an agent that has read a hostile prompt can
# rewrite the rules holding it. A duration opens the window for that long after start-up and
# then shuts on its own; reopen it while debugging with, on the docker host:
#   docker compose exec sekimore-gw python -m src.maint reload-follow 30m
#   docker compose exec sekimore-gw python -m src.maint reload-freeze   # before starting an agent
reload: 30m                     # auto (apply on save) | manual | a duration

domain_handlers:
  github.com:
    handler: github          # exact FQDN. More upstreams (e.g. GHES) need their own ssh_port (gw 0.2.0+)
  # ghe.example.com:                              # a second upstream, e.g. GitHub Enterprise Server
  #   handler: github
  #   ssh_port: 2222                              # the second and later upstreams each need their own SSH port
  #   ssh_options: [ProxyJump=bastion.example.com]  # gw 0.2.1+ passed to the upstream ssh with -o.
                                                  #   Get the bastion's host key with `sekimore-relay keyscan`
  #   api_base: https://ghe.example.com/api/v3    # gw 0.2.1+ when the API is not at the upstream's root
  # ghcr.io:                                      # gw 0.2.2+ https-relay: only 443 goes through the relay's
  #   handler: https-relay                        #   passthrough, under a per-destination upload cap
  #   max_upload_bytes: -1                        #   unlimited, for a destination you push images to.
                                                  #   Omit it to use relay.https_max_upload_bytes below
  # telemetry.example.com:
  #   handler: deny                               # resolved and then refused, with a log line.
                                                  # `splice` is the default handler: no relay, as before

relay:
  https: passthrough            # HTTPS to github.com is forwarded unchanged (reject = drop with a log line)
  # https_max_upload_bytes: 1048576   # gw 0.2.2+ default 1 MiB. Per-connection cap on what dev may send
                                      # upstream over the 443 passthrough - an exfiltration control, since
                                      # ordinary GET and API calls send far less. -1 for unlimited
  bootstrap: auto               # dev registers its disposable key and gets a project token automatically
  token_ttl: 12h                # the wrapper `sekimore` re-runs the bootstrap when the token expires,
                                # so this is not a reason to restart the container
  # store:                      # gw 0.2.17+ how the secret store is unlocked when the relay starts
  #   unlock: prompt            # prompt (the default: `mise run gw:unlock`) | file | env.
                                # file and env put the passphrase at rest, which is what prompt avoids.
                                # They exist for developing the gateway; not a deployment setting
  # limits:                     # resource bounds, not policy. The defaults are shown so they can be found
  #   cmd_max_bytes: 1048576            # longest SSH command line accepted from dev
  #   adv_max_bytes: 16777216           # largest ref advertisement read from the upstream
  #   api_body_max_bytes: 1048576       # largest API response body
  #   session_timeout: 1h               # lifetime of one relayed session
  #   idle_timeout: 5m                  # silence before a session is dropped
  #   adv_timeout: 1m                   # waiting for the upstream's advertisement
  #   max_sessions: 32                  # concurrent SSH sessions
  #   max_passthrough_conns: 256        # concurrent 443 passthrough connections
  project:
    name: sgw-sample
    repos:
      # Fill in the repositories this project may touch. Everything else is denied.
      - name: Amakata/sgw-devcontainer-base
        mode: read-write        # read-only | read-write
        bases: [main]           # branches a PR may target (push HEAD:refs/for/main)
        # Each repo may override the project defaults below. Unset means "take the project's".
        # push: ["sekimore/*"]          # branch globs a direct push may write
        # tags: ["v*"]                  # tag globs this repo may push ([] denies every tag)
        # delete: false                 # delete branches and tags on this repo
        # delete_merged_branch: false   # gw 0.2.9+ `pr merge --delete-branch` on this repo
        # signed_tags: true             # gw 0.2.27+ this repo's tags must be signed
        # permissions:                  # a delta on the project defaults; a deny wins at any layer
        #   allow: [pr:merge]
        #   deny: [issue:close]
    # upstreams:                # gw 0.2.1+ a layer between the project defaults and the repos, shared by
    #   ghe.example.com:        # every repo on one upstream. permissions is a diff; the rest are defaults
    #     permissions: { allow: [pr:create], deny: [pr:merge] }
    #     push: ["sekimore/*"]
    #     tags: []
    #     delete: false
    #     delete_merged_branch: false
    #     signed_tags: true
    #     repos:                # written without the host prefix; this upstream is implied
    #       - { name: Corp/Internal, mode: read-write, bases: [main] }
    #
    # Permissions. `resource:action`; anything not listed is denied. All 33 keys are here, so a
    # project turns one on by uncommenting it. `{allow: [...], deny: [...]}` also works.
    # The commented ones are the consequential ones - each says what you are letting go of.
    permissions:
      # pull requests
      - pr:create             # open a PR, and edit the title or body of one (`pr create` / `pr update`)
      - pr:read               # state, CI checks, description, conversation and line comments
      - pr:comment            # comment on a PR
      - pr:request_review     # ask a person for a review
      # - pr:review           # submit a review verdict. An opinion of record is a person's
      # - pr:merge            # merge a PR. This is the decision the whole setup exists to keep with a human
      # - pr:close            # close a PR, and reopen one
      # - pr:label            # gw 0.2.15+ labels on a PR (GitHub serves PRs from the issues endpoints)
      # - pr:assign           # gw 0.2.15+ assignees on a PR
      # - pr:comment_update   # gw 0.2.34+ edit a comment the agent posted. Only the agent's own; a person's is refused
      # - pr:comment_delete   # gw 0.2.34+ delete a comment the agent posted. Commenting is not the authority to erase
      # issues
      - issue:create          # file an issue
      - issue:read            # read issues and their comments
      - issue:comment         # comment on an issue
      - issue:label           # add and remove labels
      - issue:update          # gw 0.2.15+ edit an issue's title or body
      # - issue:close         # close an issue, and reopen one. Closing is a statement about the work
      # - issue:assign        # add and remove assignees. It puts work on a named person
      # - issue:comment_update  # gw 0.2.34+ edit a comment the agent posted. Only the agent's own; a person's is refused
      # - issue:comment_delete  # gw 0.2.34+ delete a comment the agent posted. Commenting is not the authority to erase
      # CI
      - ci:read               # workflow runs for a ref, which job failed, and its log
      # - ci:rerun            # re-run and cancel runs. It spends Actions minutes and runs workflow code
      #                       #   with the repository's secrets, which is why it is not part of ci:read
      # - ci:dispatch         # gw 0.2.33+ start a workflow_dispatch run. Unlike ci:rerun, it can start a workflow
      #                       #   that has never run here, e.g. a deploy
      # the repository, and search
      - repo:read             # the labels, assignable people and milestones this repository defines
      - search:read           # search across every repository of the project
      # Projects v2 boards. These do nothing until `boards:` below names a board
      - project:read          # the items on a board, with their Status and other field values
      - project:add_item      # put an issue or PR on a board
      - project:update_item   # set a field on an item, e.g. move Status
      # releases
      - release:read          # read releases
      # - release:create      # create a release for a tag already pushed, and edit one that stays a draft
      # - release:publish     # take a release out of draft. --draft exists so a human can do the publishing
      # Dependabot alerts (gw 0.2.28+). The upstream token needs the `security_events` scope, which
      # logins before 0.2.28 did not ask for: run `mise run gw:login` again after upgrading
      - security:read         # severity, package, manifest, advisory, first fixed version
      # - security:dismiss    # dismiss an alert, and reopen one. Dismissing makes a vulnerability stop
      #                       #   being shown, which is not the same act as reading it
    # boards:                 # gw 0.2.7+: required before any project:* call. Written as the URL reads
    #   - { org: acme, number: 3 }      # github.com/orgs/acme/projects/3
    #   - { user: someone, number: 1 }  # github.com/users/someone/projects/1
    # Omitted or empty refuses every Projects operation: a board's node id is opaque and says nothing
    # about its owner, so without this list any board the upstream token can see would be reachable.
    #
    # The project-wide defaults. Each is overridable per upstream and per repo, above.
    # push: ["sekimore/*"]    # branch globs a direct push may write. "sekimore/*" when unset
    # tags: []                # tag globs that may be pushed. Empty (the default) denies every tag;
                              # a release flow needs ["v*"]
    # delete: false           # deleting branches and tags, and moving a tag already upstream - the two
                              # leave the same result, so they are one permission
    # delete_merged_branch: false   # gw 0.2.9+ whether `pr merge --delete-branch` may remove the branch it
                                    # just merged. Only that branch, so it is not the authority `delete` is.
                                    # Leave it off where the forge already does this
    # signed_tags: true       # gw 0.2.27+ true when unset: a pushed tag has to be an annotated tag object
                              # carrying a signature (`git tag -s`, any format). Lightweight and unsigned
                              # tags are refused. Presence is checked, not whose key it is
