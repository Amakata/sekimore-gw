# The day-to-day operations on the Mac (Docker Desktop) side, as `mise run <task>`. `mise tasks`
# lists them.
#
# **This file is yours; .devcontainer/sgw/ is not.** The tasks come from two files there:
#
#   .devcontainer/sgw/tasks.mise.toml    the host-side tasks (vscode, web, relay:verify, upgrade …)
#   .devcontainer/sgw/gateway.mise.toml  the gateway's own tasks (gw:*), for the version it runs
#
# `mise run upgrade:apply` replaces both, with sgw.sh beside them. Put your own tasks here; a task
# here with the same name as one of those wins, so this is also where a changed task goes.
#
#   mise run upgrade         # is anything newer? (changes nothing)
#   mise run upgrade:apply   # move to it
#
# The order is the part worth remembering:
#
#   mise run vscode          # open VS Code without SSH_AUTH_SOCK (the operator's keys stay away from the AI)
#   mise run gw:unlock       # unlock the secret store. **This comes first**; locked, the GitHub API does not work
#   mise run gw:login        # first time only. It cannot run before the unlock
#   mise run relay:verify    # the acceptance check for the whole set

[task_config]
# mise ignores an include that is missing, silently. When the tasks are nowhere to be found,
# .devcontainer/sgw/ is empty: `bash .devcontainer/sgw/upgrade.sh --sync` fills it.
includes = [".devcontainer/sgw/tasks.mise.toml", ".devcontainer/sgw/gateway.mise.toml"]

[env]
# The gateway's tasks call sgw.sh through this name; the other tasks find their scripts beside it.
SGW = "{{config_root}}/.devcontainer/sgw/sgw.sh"
# The language of the task descriptions and of what the scripts print is the first of LC_ALL,
# LC_MESSAGES and LANG that says ja or en. Set it here to fix it, then take the task files again
# with `mise run upgrade:sync`:
# SEKIMORE_LANG = "ja"
