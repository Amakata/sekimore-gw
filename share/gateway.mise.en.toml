# The gateway's own operator interface, as mise tasks. Shipped inside the sekimore-gw image so a
# project *includes* this file instead of copying the tasks into its own mise.toml. A copy drifts:
# the sample project went four releases without `gw:unlock`, and from 0.2.19 that makes the
# gateway unusable, because the upstream API token lives in the secret store.
#
# In the image: /usr/local/share/sekimore/gateway.mise.en.toml (next to agent-setup.sh, same tag
# as the relay binary, so the tasks always match the gateway they drive). The Japanese one is
# gateway.mise.ja.toml; the only difference is what `mise tasks` prints — the tasks are identical.
#
# From sgw-devcontainer-base 0.2.20 on, `mise run upgrade:sync` (or `upgrade:apply`) takes this
# file from the gateway's release tag and writes it to the project as
# `.devcontainer/sgw/gateway.mise.toml`, beside `sgw.sh`. The project's mise.toml includes it:
#
#   [task_config]
#   includes = [".devcontainer/sgw/tasks.mise.toml", ".devcontainer/sgw/gateway.mise.toml"]
#
#   [env]
#   SGW = "{{config_root}}/.devcontainer/sgw/sgw.sh"
#
# Do not edit the project's copy: an edit by hand stops the next upgrade. To change a gw:* task,
# define one with the same name in the project's own mise.toml; mise prefers it.
#
# Two things the project owns and has to provide:
#
# 1. `SGW` — the path to the project's `sgw.sh`. Every task here runs through it, and nothing here
#    sets it. Unset, the tasks fail with `bash: : No such file or directory`.
# 2. The `sgw.sh` primitives these tasks use: `gw`, `gw-tty`, `id`, `recreate`. Nothing else, so
#    that sgw.sh — the one file that cannot come from the image, since it is what finds the
#    container — stays small and needs no updating.
#
#    `gw-tty` is the one to check for: it arrived late and the published sample never had it. It
#    is `docker exec -it` unconditionally, for the commands that read a passphrase from the
#    terminal (`gw:unlock`, `gw:passphrase`). The plain `gw` decides `-t` by looking at stdout as
#    well, and a task runner that prefixes output makes stdout a pipe, so the passphrase prompt
#    ends up with no terminal.
#
# Format note: in a file listed under `task_config.includes` the task names are top-level tables.
# Writing them as `[tasks."gw:unlock"]` is rejected by mise with `unknown field`.

["gw"]
description = "Run sekimore-relay <args> on the gateway (e.g. mise run gw -- revoke --label skm_xxxxxxxx)"
run = 'bash "$SGW" gw sekimore-relay'

["gw:login"]
description = "Log in to GitHub with the device flow (keeps the upstream token and known_hosts in /data/relay; first time only)"
run = 'bash "$SGW" gw sekimore-relay login'

["gw:logout"]
description = "Delete the upstream token"
run = 'bash "$SGW" gw sekimore-relay logout'

["gw:whoami"]
description = "Which GitHub identity the gateway acts as"
run = 'bash "$SGW" gw sekimore-relay whoami'

["gw:check"]
description = "The relay's configuration and state (ssh-agent / known_hosts / upstream token / registered keys / token count)"
run = 'bash "$SGW" gw sekimore-relay check'

# ---- secret store (0.2.15) ----
# The passphrase is taken at a prompt and nowhere else: an argument or an environment variable
# would show up in `ps`. That is what `gw-tty` is for.
#
# Since 0.2.19 the upstream API token lives in the store. While it is locked the relay cannot use
# the GitHub API at all (git push/pull still work — they go over SSH). Unlock after every recreate.

["gw:unlock"]
description = "Unlock the secret store (needed after every gateway recreate; the first run sets the passphrase. Locked, the GitHub API does not work)"
raw = true
run = 'bash "$SGW" gw-tty sekimore-relay unlock'

# 0.2.29: gw:unlock-auto takes the same passphrase from whatever this host already keeps secrets
# in, so a recreate needs nobody at the keyboard. The gateway is unchanged by it — the passphrase
# still arrives over the control socket, and nothing inside the gateway can go and find it.
["gw:unlock-auto"]
description = "Unlock the secret store with the passphrase this host has stored (macOS Keychain / Secret Service / a root-owned file). Says so and exits 0 when there is none"
run = '''
#!/usr/bin/env bash
set -euo pipefail
# Feed the gateway its passphrase from wherever this host already keeps secrets. The value is
# never an argument and never exported: it sits in one shell variable and leaves it only down the
# pipe into `unlock --stdin`, which reads it as one line. The gateway learns nothing new — the
# passphrase still arrives over the control socket, exactly as when it is typed.

project=$(basename "${MISE_PROJECT_ROOT:-$PWD}")
dir=${SGW_PASSPHRASE_DIR:-/etc/sekimore}
# The file sources below are root-owned by design. Read as ourselves first (the operator may be
# root already, or may own the file), sudo -n after. Never an interactive sudo: this runs inside
# gw:recreate, where a password prompt would hang an unattended restart.
maybe_root() { "$@" 2>/dev/null || sudo -n "$@" 2>/dev/null; }

pass=""
from=""
# What was consulted, for the message at the end. A backend that is installed but answered
# nothing (a locked keyring, an entry under another name) is otherwise indistinguishable from a
# host that has no backend at all, and the two want different things done about them.
tried=""
if command -v security >/dev/null 2>&1; then
  tried="$tried the macOS Keychain"
  pass=$(security find-generic-password -s sekimore-gw -a "$project" -w 2>/dev/null || true)
  if [ -n "$pass" ]; then from="the macOS Keychain"; fi
fi
if [ -z "$pass" ] && command -v secret-tool >/dev/null 2>&1; then
  tried="$tried the Secret Service"
  pass=$(secret-tool lookup service sekimore-gw project "$project" 2>/dev/null || true)
  if [ -n "$pass" ]; then from="the Secret Service"; fi
fi
# A server has neither of those. systemd-creds first: it ties the file to this machine's TPM or
# host key, so a copied disk does not carry a usable passphrase. The plain file does, which is
# why it is last.
if [ -z "$pass" ] && [ -e "$dir/$project.passphrase.cred" ]; then
  tried="$tried $dir/$project.passphrase.cred"
  pass=$(maybe_root systemd-creds decrypt --name=sekimore-gw "$dir/$project.passphrase.cred" - || true)
  if [ -n "$pass" ]; then from="$dir/$project.passphrase.cred"; fi
fi
if [ -z "$pass" ] && [ -e "$dir/$project.passphrase" ]; then
  tried="$tried $dir/$project.passphrase"
  pass=$(maybe_root cat "$dir/$project.passphrase" || true)
  if [ -n "$pass" ]; then from="$dir/$project.passphrase"; fi
fi

# Exit 0 with nothing stored: gw:recreate calls this unconditionally, and a host that never set a
# passphrase up is not a failed recreate.
if [ -z "$pass" ]; then
  echo "gw:unlock-auto: no passphrase stored for '$project' on this host${tried:+ (asked:$tried)}. Store one with: mise run gw:keychain-set   (or unlock by hand with: mise run gw:unlock)"
  exit 0
fi

echo "gw:unlock-auto: unlocking from $from"
printf '%s\n' "$pass" | bash "$SGW" gw sekimore-relay unlock --stdin
'''

["gw:keychain-set"]
description = "Store the secret store's passphrase in this host's own keychain, once, so that gw:recreate unlocks by itself afterwards"
# raw: the backend prompts for the passphrase on this terminal, and mise must not sit between
raw = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
# Put the gateway's passphrase into this host's own secret store, once. Read back afterwards: a
# store that silently did not happen looks exactly like one that did, until the next recreate.

project=$(basename "${MISE_PROJECT_ROOT:-$PWD}")
dir=${SGW_PASSPHRASE_DIR:-/etc/sekimore}

if command -v security >/dev/null 2>&1; then
  # security prompts for the password itself, echo off and with a retype. Handing it over as
  # -w <value> would put the passphrase in ps for as long as the command runs.
  security add-generic-password -U -s sekimore-gw -a "$project" -w
  stored=$(security find-generic-password -s sekimore-gw -a "$project" -w 2>/dev/null || true)
  if [ -z "$stored" ]; then
    echo "gw:keychain-set: nothing was stored - the Keychain has no sekimore-gw entry for '$project'" >&2
    exit 1
  fi
  echo "gw:keychain-set: the macOS Keychain now holds a passphrase for '$project' ($(printf %s "$stored" | wc -m | tr -d ' ') characters). mise run gw:recreate will use it."
  exit 0
fi

if command -v secret-tool >/dev/null 2>&1; then
  # Typed twice. Nothing here can tell a mistyped passphrase from the right one, and stored
  # wrong it fails at every recreate from now on rather than at the keyboard.
  printf 'Passphrase for %s: ' "$project" >&2
  read -rs pass
  echo >&2
  printf 'Again: ' >&2
  read -rs again
  echo >&2
  if [ -z "$pass" ]; then
    echo "gw:keychain-set: an empty passphrase is not accepted; nothing was stored" >&2
    exit 1
  fi
  if [ "$pass" != "$again" ]; then
    echo "gw:keychain-set: the two did not match; nothing was stored" >&2
    exit 1
  fi
  printf '%s\n' "$pass" | secret-tool store --label="sekimore-gw $project" service sekimore-gw project "$project"
  stored=$(secret-tool lookup service sekimore-gw project "$project" 2>/dev/null || true)
  if [ "$stored" != "$pass" ]; then
    echo "gw:keychain-set: the Secret Service did not give back what was stored for '$project'" >&2
    exit 1
  fi
  echo "gw:keychain-set: the Secret Service now holds a passphrase for '$project' ($(printf %s "$stored" | wc -m | tr -d ' ') characters). mise run gw:recreate will use it."
  exit 0
fi

cat >&2 <<EOF
gw:keychain-set: this host has neither the macOS Keychain (security) nor a Secret Service
(secret-tool), so there is nowhere to put it. On a server, use a root-owned file instead.
This is the host's own $dir - the gateway has a directory of the same name inside the
container, and mounting this one into it would hand the gateway its own passphrase.

Preferred - tied to this machine, so a copied disk does not carry a usable passphrase:

  sudo install -d -m 0755 $dir
  sudo systemd-creds encrypt --name=sekimore-gw - $dir/$project.passphrase.cred
      (type the passphrase, then Ctrl-D)

Without systemd-creds - the file itself is the secret, so a copy of it is the store:

  sudo install -d -m 0755 $dir
  sudo install -m 0600 /dev/null $dir/$project.passphrase
  sudo tee $dir/$project.passphrase >/dev/null   (type the passphrase and Enter, then Ctrl-D)

mise run gw:unlock-auto reads either of those. Set SGW_PASSPHRASE_DIR to use another directory.
EOF
exit 1
'''

["gw:lock"]
description = "Forget the secret store's key (the GitHub API stops until the next unlock; since 0.2.19 the cached token goes with it)"
run = 'bash "$SGW" gw sekimore-relay lock'

["gw:proxy-credential"]
description = "The upstream proxy's credential, in the store instead of a file dev can read: mise run gw:proxy-credential -- set|clear"
# raw + gw-tty: `set` reads the username and password from the terminal, never as arguments
raw = true
run = 'bash "$SGW" gw-tty sekimore-relay proxy-credential'

["gw:store-status"]
description = "Whether the secret store is unlocked, locked, or not initialised yet"
run = 'bash "$SGW" gw sekimore-relay store-status'

["gw:passphrase"]
description = "Change the secret store's passphrase (--kdf pbkdf2-sha256 switches the KDF as well)"
raw = true
run = 'bash "$SGW" gw-tty sekimore-relay passphrase'

# export works while locked (it needs no key). The envelope is sealed, but the passphrase is all
# that protects it. raw: the JSON goes to stdout as it is — a prefix from the task runner breaks it.
["gw:store-export"]
description = "Write the secret store out sealed: mise run gw:store-export > store.json"
raw = true
run = 'bash "$SGW" gw sekimore-relay store-export'

["gw:store-import"]
description = "Replace an empty secret store with an envelope: mise run gw:store-import < store.json"
raw = true
run = 'bash "$SGW" gw sekimore-relay store-import'

# ---- project tokens ----
["gw:tokens"]
description = "The project tokens that have been issued (label / expiry / use count / state)"
run = 'bash "$SGW" gw sekimore-relay tokens'

["gw:revoke"]
description = "Revoke one token: mise run gw:revoke -- --label skm_xxxxxxxx"
run = 'bash "$SGW" gw sekimore-relay revoke'

["gw:revoke-project"]
description = "Revoke every token of the project (when the project ends)"
run = 'bash "$SGW" gw sekimore-relay revoke-project'

["gw:bootstrap"]
description = "The kill-switch for automatic registration: mise run gw:bootstrap -- disable|enable"
run = 'bash "$SGW" gw sekimore-relay bootstrap'

# ---- log database ----
["gw:db-stats"]
description = "Rows, period, size and indexes of the gateway's log DB (DNS / firewall / proxy) (gw 0.2.3+)"
run = 'bash "$SGW" gw python -m src.maint db-stats'

["gw:db-prune"]
description = "Delete logs older than N days (kept by default, so this is explicit): mise run gw:db-prune -- --before-days 90 --yes [--vacuum]"
run = 'bash "$SGW" gw python -m src.maint db-prune'

["gw:db-reset"]
description = "Empty the log DB and VACUUM (the relay's audit log is a separate file): mise run gw:db-reset -- --yes"
run = 'bash "$SGW" gw python -m src.maint db-reset'

# ---- config.yml reload window ----
["gw:reload-status"]
description = "Whether saving config.yml takes effect right now (gw 0.2.13+). Check this before handing work to an AI"
run = 'bash "$SGW" gw python -m src.maint reload-status'

["gw:reload-follow"]
description = "Open the reload window (30m by default): mise run gw:reload-follow -- 1h. Only while you are editing config.yml"
run = 'bash "$SGW" gw python -m src.maint reload-follow'

["gw:reload-freeze"]
description = "Close the reload window now. config.yml is writable from dev, so run this before handing work to an AI"
run = 'bash "$SGW" gw python -m src.maint reload-freeze'

# ---- logs and lifecycle ----
["gw:audit"]
description = "Follow the relay's audit log (every denial and every operation. Ctrl-C to stop)"
run = 'bash "$SGW" gw tail -n 50 -f /data/relay/audit.jsonl'

["gw:logs"]
description = "Follow the gateway container's log"
run = 'docker logs -f --tail 100 "$(bash "$SGW" id sekimore-gw)"'

["gw:restart"]
description = "Restart the gateway (after changing domain_handlers / relay in config.yml. dev keeps running)"
run = 'docker restart "$(bash "$SGW" id sekimore-gw)"'

["gw:recreate"]
description = "Pull the latest image and recreate the gateway (after raising the image tag in compose; docker restart does not swap the image), then unlock the store when this host has the passphrase (SGW_NO_AUTO_UNLOCK=1 to leave it locked)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
bash "$SGW" recreate
# A recreated gateway starts locked, and a locked store means no GitHub API at all. Unlocking
# here is the difference between a recreate and a recreate plus a person. On a host with nothing
# stored, gw:unlock-auto says so and exits 0, so this stays quiet there.
if [ -n "${SGW_NO_AUTO_UNLOCK:-}" ]; then
  echo "gw:recreate: SGW_NO_AUTO_UNLOCK is set, so the store was left locked. Unlock it with: mise run gw:unlock"
  exit 0
fi
if ! mise run gw:unlock-auto; then
  echo "gw:recreate: the gateway was recreated, but the automatic unlock failed. Unlock it with: mise run gw:unlock" >&2
  exit 1
fi
'''

["gw:shell"]
description = "A shell on the gateway (root)"
# raw + gw-tty: a shell needs the terminal. In mise's prefix output mode stdout is a pipe, the
# plain `gw` then drops -t, and bash sits there without a prompt (#149)
raw = true
run = 'bash "$SGW" gw-tty bash'
