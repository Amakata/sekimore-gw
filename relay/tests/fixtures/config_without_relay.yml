# Shared fixture: the traditional configuration, no relay. Read by the Python tests, the Rust relay tests and the equivalence
# harness (relay/tests/equivalence/). tests/fixtures/ links here while the Python tests exist.
name: fixture-without-relay
allow_domains:
  - pypi.org
  - .github.com
  - api.openai.com
block_domains:
  - evil.example.com
ignore_domains: []
allow_ips: []
block_ips: []
proxy:
  enabled: false
  port: 3128
network:
  lan_subnets: []
database_path: /data/security_gateway.db
