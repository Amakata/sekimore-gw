[package]
name = "sekimore-relay"
version = "0.2.12"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "Policy-enforcing relay for AI agents: git over SSH and GitHub API, per-project"

[features]
default = []
# Enables LocalGitUpstream (runs git receive-pack/upload-pack against a local bare repo)
# for end-to-end tests. Never enabled in the image build.
test-hooks = []

[dependencies]
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "fs", "sync", "time", "signal"] }
russh = { version = "0.63", default-features = false, features = ["ring", "flate2"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
hyper = { version = "1.7", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
humantime = "2.2"
humantime-serde = "1.1"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.3"
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
url = { version = "2.5", features = ["serde"] }
libc = "0.2"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
