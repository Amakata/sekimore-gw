[package]
name = "sekimore-relay"
version = "0.2.37"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "Policy-enforcing relay for AI agents: git over SSH and GitHub API, per-project"

[features]
default = []
# Enables LocalGitUpstream (runs git receive-pack/upload-pack against a local bare repo)
# for end-to-end tests. Never enabled in the image build.
test-hooks = []

[dependencies]
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "fs", "sync", "time", "signal"] }
russh = { version = "0.63", default-features = false, features = ["ring", "flate2"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
hyper = { version = "1.7", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
humantime = "2.2"
humantime-serde = "1.1"
sha2 = "0.11"
hex = "0.4"
getrandom = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
url = { version = "2.5", features = ["serde"] }
libc = "0.2"
async-trait = "0.1"
# 0.2.15: the secret store. All pure Rust — the musl build and the CI check that neither
# aws-lc-rs nor openssl-sys is in the tree both depend on that.
aes-gcm = "0.11"
argon2 = "0.6"
zeroize = { version = "1.8", features = ["derive"] }
hmac = "0.13"
rusqlite = { version = "0.40", features = ["bundled"] }
# 0.2.27: reading a pushed tag object out of the pack (#89). Both pure Rust; flate2 was already in
# the tree through russh, sha1 through russh as well
flate2 = "1.1"
sha1 = "0.11"
base64 = "0.23"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
