name: Test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite finishes in under a minute; anything beyond this is the job wedged rather than slow,
    # and a wedged job blocks the pull request for the full six-hour default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        # The suite reports in about 40 seconds and then the process does not exit on this runner
        # — three runs in a row sat for nine minutes until the cap. Cancelling the log streamer's
        # task helped locally but not here, and chasing the last waiter is not worth holding the
        # branch for. `timeout` ends the process once the report is written, and the pipeline
        # keeps pytest's exit code rather than timeout's, so a real failure still fails the job.
        # -p no:cacheprovider: the cache writes into the checkout, which a discarded runner has no
        # use for. Coverage options come from addopts in pyproject.toml.
        run: |
          rc=0
          timeout --signal=KILL 300 uv run pytest -m "not e2e" -v -p no:cacheprovider \
            | tee /tmp/pytest.out || rc=${PIPESTATUS[0]}
          # pytest hangs after printing its report here, so the kill is expected and its exit code
          # says nothing. What the run means is in the report — and treating 137 as success alone
          # made a red suite green: a failing test rode through releases behind this.
          if [ "$rc" = 137 ]; then
            echo "::warning::pytest did not exit after reporting; killed after 300s"
          elif [ "$rc" != 0 ]; then
            exit "$rc"
          fi
          grep -qE '^=+ .*[0-9]+ failed' /tmp/pytest.out && { echo "::error::pytest reported failures"; exit 1; }
          grep -qE '^=+ .*[0-9]+ passed' /tmp/pytest.out || { echo "::error::pytest printed no summary"; exit 1; }
          exit 0
