name: Preview image

# 作業用のイメージ。公式版 (docker-publish.yml, v*.*.* タグ) とは別物で、変更を検証する
# 人だけが使う。これが無いと、gateway の変更を実機で試すために公式版を切るしかない。
#
# arm64 のみ焼く。検証機が Apple Silicon で、毎 push に両アーキテクチャを積む理由が無い
# ため。公式版は両方のままで、こちらの経路は何も変えていない。
#
# マルチアーキテクチャではないので、docker-publish.yml の digest push → manifest merge の
# 二段構えも要らない。タグを付けて直接 push する。
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "base/**"
      - "relay/templates/**"
      - "tests/**"
      - "relay/tests/**"
      - ".github/workflows/base.yml"
      - ".github/workflows/base-tests.yml"
      - ".github/workflows/relay.yml"
      - ".github/workflows/lint.yml"
      - ".github/workflows/test.yml"
      - ".github/workflows/docker-publish.yml"
      - ".github/dependabot.yml"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "base/**"
      - "relay/templates/**"
      - "tests/**"
      - "relay/tests/**"
      - ".github/workflows/base.yml"
      - ".github/workflows/base-tests.yml"
      - ".github/workflows/relay.yml"
      - ".github/workflows/lint.yml"
      - ".github/workflows/test.yml"
      - ".github/workflows/docker-publish.yml"
      - ".github/dependabot.yml"

# 同じ PR への連続 push が同じタグを奪い合わないよう、前の実行を打ち切る。
# 後発が先に終わると古い内容がタグに残るのと、arm64 ランナーの時間の節約と両方。
concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  preview:
    # fork からの PR には secrets が渡らないので GHCR に push できない。誰にも直せない赤を
    # 残さないよう、押せないときは走らせない
    #
    # Dependabot の PR も同じ理由で外す。ブランチはこのリポジトリにあるので上の fork 判定は
    # 通ってしまうが、dependabot[bot] が起こした pull_request の GITHUB_TOKEN は read-only に
    # 落とされ、packages: write を書いても効かない。放っておくと依存更新の PR が毎回赤くなる。
    # push (main) 側は誰が押しても焼く。
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Docker の参照は小文字でなければならない (github.repository は大文字を含む)
      - name: Lowercase image name
        run: echo "IMAGE_LC=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Tag for this build
        run: |
          set -eu
          if [ "${{ github.event_name }}" = pull_request ]; then
            echo "PREVIEW_TAG=pr-${{ github.event.number }}" >> "$GITHUB_ENV"
          else
            echo "PREVIEW_TAG=main" >> "$GITHUB_ENV"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          # unknown/unknown の attestation manifest を出さない (公式版と揃える)
          provenance: false
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_LC }}:${{ env.PREVIEW_TAG }}
          # preview 自身のキャッシュだけ。公式版 (docker-publish.yml) は書き出しに 3m38s かかって
          # いたのをやめたので、読む先が無くなった (#97)。こちらは PR を連続で押すときに効くうえ、
          # main への push でも動くのでキャッシュが ref スコープで孤立しない
          cache-from: type=gha,scope=preview-arm64
          cache-to: type=gha,mode=max,scope=preview-arm64

      # docker-publish.yml の smoke test と同じ内容。ランナーが arm64 なので --platform は要らない
      - name: Smoke test relay binary
        run: |
          set -u
          IMAGE="${REGISTRY}/${IMAGE_LC}:${PREVIEW_TAG}"
          test -f tests/fixtures/config_with_relay.yml || { echo "fixtures missing (no checkout?)"; exit 1; }
          docker run --rm "$IMAGE" sekimore-relay --version
          docker run --rm "$IMAGE" sh -c 'ldd /usr/local/bin/sekimore-relay 2>&1 | grep -qi "not a dynamic\|statically"'
          rc=0; docker run --rm -v "$PWD/tests/fixtures/config_without_relay.yml:/etc/sekimore/config.yml:ro" "$IMAGE" sekimore-relay needs-relay || rc=$?
          test "$rc" -eq 1
          rc=0; docker run --rm -v "$PWD/tests/fixtures/config_with_relay.yml:/etc/sekimore/config.yml:ro" "$IMAGE" sekimore-relay needs-relay || rc=$?
          test "$rc" -eq 0

      - name: How to run it
        run: |
          echo "### Preview image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${REGISTRY}/${IMAGE_LC}:${PREVIEW_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "linux/arm64 only. Not a release; the tag is rewritten by the next push." >> "$GITHUB_STEP_SUMMARY"
