name: Lint

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Run ruff check
        run: uv run ruff check src/ tests/

      - name: Run ruff format check
        run: uv run ruff format --check src/ tests/

      - name: Run mypy type check
        run: uv run mypy src/

      # Documentation the release process writes by hand, so it drifts silently. Runs here as well
      # as in the test suite, because a changelog problem is a lint problem: nothing is broken.
      - name: Check the changelog style
        run: uv run pytest tests/unit/test_changelog_style.py -q --no-cov
