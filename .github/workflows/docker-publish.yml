name: Docker Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # アーキごとに「その CPU のネイティブランナー」でビルドし、digest だけを push する。
  # arm64 を QEMU で回さないので大幅に速い (以前は 1 ジョブで両アーキ、arm64 が QEMU で ~10 分)。
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm      # GitHub ホストのネイティブ arm64 (public repo は無料)
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      # Docker の参照はリポジトリ名が小文字でなければならない (github.repository は Amakata/… と大文字を含む)。
      # metadata-action のタグは自動で小文字化されるが、push-by-digest の name= と merge の REPO は自前なので明示的に小文字化する
      - name: Lowercase image name
        run: echo "IMAGE_LC=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest (${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # マニフェストは付けず digest だけ push。タグ付けは merge ジョブでまとめて行う
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_LC }},push-by-digest=true,name-canonical=true,push=true
          # キャッシュはアーキごとに分ける (scope) と汚染しない
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # digest は job outputs ではなく artifact で渡す。matrix の各 instance は同じ outputs マップに書くので、
      # 片方が設定しないキーが空文字で上書きされ得る (完了順に依存して digest が消える)。artifact なら確実
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          test -n "$digest"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # 2 つの digest を 1 つのマルチアーキ・マニフェストにまとめてタグを付ける
  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Lowercase image name
        run: echo "IMAGE_LC=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          set -eu
          REPO="${REGISTRY}/${IMAGE_LC}"
          # digest はファイル名 (sha256 の hex) として届く。2 アーキ分が揃っていること
          n=$(ls | wc -l); test "$n" -eq 2 || { echo "expected 2 digests, got $n"; ls; exit 1; }
          # メタデータの各タグ (改行区切り) に対し、全 digest を束ねた manifest を作成
          echo "${{ steps.meta.outputs.tags }}" | while read -r TAG; do
            [ -n "$TAG" ] || continue
            # shellcheck disable=SC2046
            docker buildx imagetools create -t "$TAG" $(printf "${REPO}@sha256:%s " *)
          done
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      - name: Smoke test relay binary (amd64)
        run: |
          set -u
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker pull --platform linux/amd64 "$IMAGE"
          docker run --rm --platform linux/amd64 "$IMAGE" sekimore-relay --version
          docker run --rm --platform linux/amd64 "$IMAGE" sh -c 'ldd /usr/local/bin/sekimore-relay 2>&1 | grep -qi "not a dynamic\|statically"'
          rc=0; docker run --rm --platform linux/amd64 -v "$PWD/tests/fixtures/config_without_relay.yml:/etc/sekimore/config.yml:ro" "$IMAGE" sekimore-relay needs-relay || rc=$?
          test "$rc" -eq 1
          rc=0; docker run --rm --platform linux/amd64 -v "$PWD/tests/fixtures/config_with_relay.yml:/etc/sekimore/config.yml:ro" "$IMAGE" sekimore-relay needs-relay || rc=$?
          test "$rc" -eq 0
