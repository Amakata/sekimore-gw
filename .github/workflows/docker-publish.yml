name: Docker Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # アーキごとに「その CPU のネイティブランナー」でビルドし、digest だけを push する。
  # arm64 を QEMU で回さないので大幅に速い (以前は 1 ジョブで両アーキ、arm64 が QEMU で ~10 分)。
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm      # GitHub ホストのネイティブ arm64 (public repo は無料)
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    outputs:
      # 後続の merge ジョブが digest を集めるため、両ジョブの digest を出力する
      digest-amd64: ${{ steps.export.outputs.digest-amd64 }}
      digest-arm64: ${{ steps.export.outputs.digest-arm64 }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest (${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # マニフェストは付けず digest だけ push。タグ付けは merge ジョブでまとめて行う
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # キャッシュはアーキごとに分ける (scope) と汚染しない
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        id: export
        run: echo "digest-${{ matrix.arch }}=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  # 2 つの digest を 1 つのマルチアーキ・マニフェストにまとめてタグを付ける
  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create and push manifest list
        run: |
          set -eu
          REPO="${REGISTRY}/${IMAGE_NAME}"
          AMD64="${{ needs.build.outputs.digest-amd64 }}"
          ARM64="${{ needs.build.outputs.digest-arm64 }}"
          # メタデータの各タグ (改行区切り) に対し、2 アーキの digest を束ねた manifest を作成
          echo "${{ steps.meta.outputs.tags }}" | while read -r TAG; do
            [ -n "$TAG" ] || continue
            docker buildx imagetools create -t "$TAG" \
              "${REPO}@${AMD64}" "${REPO}@${ARM64}"
          done
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      - name: Smoke test relay binary (amd64)
        run: |
          set -u
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker pull --platform linux/amd64 "$IMAGE"
          docker run --rm --platform linux/amd64 "$IMAGE" sekimore-relay --version
          docker run --rm --platform linux/amd64 "$IMAGE" sh -c 'ldd /usr/local/bin/sekimore-relay 2>&1 | grep -qi "not a dynamic\|statically"'
          rc=0; docker run --rm --platform linux/amd64 -v "$PWD/tests/fixtures/config_without_relay.yml:/etc/sekimore/config.yml:ro" "$IMAGE" sekimore-relay needs-relay || rc=$?
          test "$rc" -eq 1
          rc=0; docker run --rm --platform linux/amd64 -v "$PWD/tests/fixtures/config_with_relay.yml:/etc/sekimore/config.yml:ro" "$IMAGE" sekimore-relay needs-relay || rc=$?
          test "$rc" -eq 0
