name: Docker Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # the base image's name (lowercase, as Docker wants it); built by the base-* jobs below
  BASE_IMAGE: amakata/sgw-devcontainer-base

jobs:
  # Build each architecture on a runner native to that CPU and push only the digest.
  # Much faster, since arm64 no longer goes through QEMU (it used to be one job for both
  # architectures, with arm64 taking ~10 min under QEMU).
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-26.04-arm      # GitHub-hosted native arm64 (free for public repos)
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Docker references require a lowercase repository name (github.repository contains uppercase, e.g. Amakata/...).
      # metadata-action lowercases its tags automatically, but the push-by-digest name= and the REPO in merge are ours, so lowercase them explicitly
      - name: Lowercase image name
        run: echo "IMAGE_LC=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A fixed epoch, not the commit's. `rewrite-timestamp` normalises every layer's mtimes to
      # this, so a layer whose *contents* did not change produces the same digest even when it was
      # rebuilt from scratch — which is what stops a release re-pulling 160 MB of identical
      # content (#97). The commit date would defeat that: a different release, a different value,
      # a different digest.
      #
      # The value is arbitrary but must never change. 2020-01-01T00:00:00Z.
      - name: Normalise the layer timestamps
        run: echo "SOURCE_DATE_EPOCH=1577836800" >> "$GITHUB_ENV"

      - name: Build and push by digest (${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Do not emit the unknown/unknown attestation (provenance) manifest (matches base)
          provenance: false
          # Push only the digest, no manifest. Tagging happens all together in the merge job
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_LC }},push-by-digest=true,name-canonical=true,push=true,rewrite-timestamp=true
          # No build cache, deliberately. Measured on 0.2.20's amd64 build: the image built in
          # 4m00s and `cache-to: mode=max` then spent **3m38s** writing layers — for a cache that
          # #97 showed was never read, since this workflow only runs on tags and a GitHub Actions
          # cache is scoped by ref. Even reachable, exporting cost more than the 2m16s of build it
          # could save. The timestamp normalisation above is what keeps the digests stable, which
          # is the part that actually mattered; the build itself is cheap enough to just do.

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          test -n "$digest"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combine the two digests into a single multi-arch manifest and tag it
  merge:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      # The smoke test bind-mounts tests/fixtures/*.yml, so the merge job needs a checkout too
      # (without it, mounting a nonexistent path yields an empty directory, needs-relay returns 2 and the rc check fails)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lowercase image name
        run: echo "IMAGE_LC=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          set -eu
          REPO="${REGISTRY}/${IMAGE_LC}"
          # Digests arrive as file names (the sha256 hex). Both architectures must be present
          n=$(ls | wc -l); test "$n" -eq 2 || { echo "expected 2 digests, got $n"; ls; exit 1; }
          # For each metadata tag (newline-separated), create a manifest combining every digest
          echo "${{ steps.meta.outputs.tags }}" | while read -r TAG; do
            [ -n "$TAG" ] || continue
            # shellcheck disable=SC2046
            docker buildx imagetools create -t "$TAG" $(printf "${REPO}@sha256:%s " *)
          done
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      - name: Smoke test relay binary (amd64)
        run: |
          set -u
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          test -f tests/fixtures/config_with_relay.yml || { echo "fixtures missing (no checkout?)"; exit 1; }
          docker pull --platform linux/amd64 "$IMAGE"
          docker run --rm --platform linux/amd64 "$IMAGE" sekimore-relay --version
          docker run --rm --platform linux/amd64 "$IMAGE" sh -c 'ldd /usr/local/bin/sekimore-relay 2>&1 | grep -qi "not a dynamic\|statically"'
          rc=0; docker run --rm --platform linux/amd64 -v "$PWD/tests/fixtures/config_without_relay.yml:/etc/sekimore/config.yml:ro" "$IMAGE" sekimore-relay needs-relay || rc=$?
          test "$rc" -eq 1
          rc=0; docker run --rm --platform linux/amd64 -v "$PWD/tests/fixtures/config_with_relay.yml:/etc/sekimore/config.yml:ro" "$IMAGE" sekimore-relay needs-relay || rc=$?
          test "$rc" -eq 0

  # ---- the dev-container base image, from the gateway image this tag just published (#235) ----
  # base/Dockerfile copies the relay and the agent guide out of the gateway image, so it builds
  # after `merge` has tagged that image, against exactly this tag's version. Same digest-per-arch
  # shape as above; the image name is the base's own.
  base-build:
    needs: merge
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalise the layer timestamps
        run: echo "SOURCE_DATE_EPOCH=1577836800" >> "$GITHUB_ENV"

      - name: Build and push by digest (${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: base
          file: base/Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          build-args: |
            SEKIMORE_GW_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_LC }}:${{ env.VERSION }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.BASE_IMAGE }},push-by-digest=true,name-canonical=true,push=true,rewrite-timestamp=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          test -n "$digest"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: base-digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  base-merge:
    needs: base-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: base-digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.BASE_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          set -eu
          REPO="${REGISTRY}/${BASE_IMAGE}"
          n=$(ls | wc -l); test "$n" -eq 2 || { echo "expected 2 digests, got $n"; ls; exit 1; }
          echo "${{ steps.meta.outputs.tags }}" | while read -r TAG; do
            [ -n "$TAG" ] || continue
            # shellcheck disable=SC2046
            docker buildx imagetools create -t "$TAG" $(printf "${REPO}@sha256:%s " *)
          done

      # The image holds the relay of this same tag: what base/tests/test_image.sh asks locally
      - name: Smoke test (amd64)
        run: |
          set -eu
          IMAGE="${REGISTRY}/${BASE_IMAGE}:${VERSION}"
          docker pull --platform linux/amd64 "$IMAGE"
          got=$(docker run --rm --platform linux/amd64 --entrypoint /usr/local/bin/sekimore-relay "$IMAGE" --version)
          echo "$got"
          case "$got" in *"$VERSION"*) ;; *) echo "the base image holds '$got', not $VERSION"; exit 1 ;; esac
