name: Docker Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build each architecture on a runner native to that CPU and push only the digest.
  # Much faster, since arm64 no longer goes through QEMU (it used to be one job for both
  # architectures, with arm64 taking ~10 min under QEMU).
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm      # GitHub-hosted native arm64 (free for public repos)
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Docker references require a lowercase repository name (github.repository contains uppercase, e.g. Amakata/...).
      # metadata-action lowercases its tags automatically, but the push-by-digest name= and the REPO in merge are ours, so lowercase them explicitly
      - name: Lowercase image name
        run: echo "IMAGE_LC=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Makes a rebuild of this commit produce the same image as the last one: a layer's tar
      # carries mtimes, so without this two builds of identical source differ. That is what #90
      # was after.
      #
      # It is *not* what stops the 160 MB re-pull between releases (#97) — the epoch comes from
      # the commit, so a different release normalises to a different value and a cold rebuild
      # still moves the digest. The registry cache below is what stops that, by not rebuilding
      # the layer at all.
      - name: Timestamp the layers from the commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Build and push by digest (${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Do not emit the unknown/unknown attestation (provenance) manifest (matches base)
          provenance: false
          # Push only the digest, no manifest. Tagging happens all together in the merge job.
          # rewrite-timestamp normalises the layer mtimes to SOURCE_DATE_EPOCH above
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_LC }},push-by-digest=true,name-canonical=true,push=true,rewrite-timestamp=true
          # Registry cache, not type=gha: this workflow runs only on v*.*.* tags, and a GitHub
          # Actions cache is scoped by ref — one written under refs/tags/v0.2.19 cannot be read
          # from refs/tags/v0.2.20. Every release was writing a cache nobody would ever read and
          # building from cold. A registry cache has no ref scoping
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_LC }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_LC }}:buildcache-${{ matrix.arch }},mode=max

      # Pass the digest as an artifact rather than through job outputs: every matrix instance writes to the
      # same outputs map, so a key one of them does not set can be overwritten with an empty string (losing a
      # digest, depending on completion order). An artifact is reliable
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          test -n "$digest"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combine the two digests into a single multi-arch manifest and tag it
  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The smoke test bind-mounts tests/fixtures/*.yml, so the merge job needs a checkout too
      # (without it, mounting a nonexistent path yields an empty directory, needs-relay returns 2 and the rc check fails)
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Lowercase image name
        run: echo "IMAGE_LC=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          set -eu
          REPO="${REGISTRY}/${IMAGE_LC}"
          # Digests arrive as file names (the sha256 hex). Both architectures must be present
          n=$(ls | wc -l); test "$n" -eq 2 || { echo "expected 2 digests, got $n"; ls; exit 1; }
          # For each metadata tag (newline-separated), create a manifest combining every digest
          echo "${{ steps.meta.outputs.tags }}" | while read -r TAG; do
            [ -n "$TAG" ] || continue
            # shellcheck disable=SC2046
            docker buildx imagetools create -t "$TAG" $(printf "${REPO}@sha256:%s " *)
          done
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      - name: Smoke test relay binary (amd64)
        run: |
          set -u
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          test -f tests/fixtures/config_with_relay.yml || { echo "fixtures missing (no checkout?)"; exit 1; }
          docker pull --platform linux/amd64 "$IMAGE"
          docker run --rm --platform linux/amd64 "$IMAGE" sekimore-relay --version
          docker run --rm --platform linux/amd64 "$IMAGE" sh -c 'ldd /usr/local/bin/sekimore-relay 2>&1 | grep -qi "not a dynamic\|statically"'
          rc=0; docker run --rm --platform linux/amd64 -v "$PWD/tests/fixtures/config_without_relay.yml:/etc/sekimore/config.yml:ro" "$IMAGE" sekimore-relay needs-relay || rc=$?
          test "$rc" -eq 1
          rc=0; docker run --rm --platform linux/amd64 -v "$PWD/tests/fixtures/config_with_relay.yml:/etc/sekimore/config.yml:ro" "$IMAGE" sekimore-relay needs-relay || rc=$?
          test "$rc" -eq 0
