name: Relay (Rust)

on:
  push:
    branches: [main, master]
    paths:
      - "relay/**"
      - ".github/workflows/relay.yml"
      - "tests/fixtures/**"
  pull_request:
    paths:
      - "relay/**"
      - ".github/workflows/relay.yml"
      - "tests/fixtures/**"
  schedule:
    - cron: "17 3 * * 1" # weekly, to pick up new advisories
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b4f984c1e7daae8e175614de3e73a8411a20333c # 1.89.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: relay
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets --features test-hooks,host -- -D warnings
      - name: test (e2e requires git + ssh)
        run: cargo test --features test-hooks,host --locked
        env:
          SEKIMORE_E2E_REQUIRED: "1"
      - name: forbidden dependencies
        run: |
          ! cargo tree -i aws-lc-rs 2>/dev/null
          ! cargo tree -i openssl-sys 2>/dev/null

  audit:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b4f984c1e7daae8e175614de3e73a8411a20333c # 1.89.0
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  # sgw is built on macOS for the Release (docker-publish.yml); a Linux-only libc constant in
  # any module of the crate breaks that build, and the tag is the first to know unless this runs
  macos-check:
    runs-on: macos-14
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b4f984c1e7daae8e175614de3e73a8411a20333c # 1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: relay
      - run: cargo check --locked --features host --bin sgw

  musl-build:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b4f984c1e7daae8e175614de3e73a8411a20333c # 1.89.0
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: relay
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: statically linked and needs-relay exit codes
        # The Actions shell is bash -e. needs-relay returning 1 is expected, so catch it with `|| rc=$?`
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/sekimore-relay
          file "$BIN"
          file "$BIN" | grep -q "static"
          "$BIN" --version
          rc=0; "$BIN" --config ../tests/fixtures/config_without_relay.yml needs-relay || rc=$?
          test "$rc" -eq 1
          rc=0; "$BIN" --config ../tests/fixtures/config_with_relay.yml needs-relay || rc=$?
          test "$rc" -eq 0
