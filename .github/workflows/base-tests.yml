name: Base files

# The shell test of sgw-post-start. It needs no Docker; the image build is base.yml. That UPGRADING
# covers the gateway version is checked by tools.yml (tools/tests/upgrading.rs, #506).
on:
  push:
    branches: [main, next]
    paths:
      - "base/**"
      - "!base/**.md"
      - "pyproject.toml"
      - ".github/workflows/base-tests.yml"
  pull_request:
    paths:
      - "base/**"
      - "!base/**.md"
      - "pyproject.toml"
      - ".github/workflows/base-tests.yml"
  workflow_dispatch:

jobs:
  post-start:
    name: sgw-post-start runs setup, docker-init and post-create in order
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: scripts/sgw-post-start
        run: base/tests/test_sgw_post_start.sh
