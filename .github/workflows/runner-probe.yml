# Temporary (#154): does a 26.04 runner exist for both architectures, and does what we build on
# survive it? Deleted before this pull request is merged; an unknown label queues forever rather
# than failing, so this runs on its own with a timeout.
name: runner-probe

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: What this runner is
        run: |
          . /etc/os-release; echo "$PRETTY_NAME  $(uname -m)"
          echo "python3: $(python3 --version 2>&1)"
          echo "docker:  $(docker --version 2>&1)"
          echo "buildx:  $(docker buildx version 2>&1)"
          echo "script:  $(script --version 2>&1 | head -1)"
          echo "musl:    $(dpkg -s musl-tools 2>/dev/null | sed -n 's/^Version: //p' || echo 'not installed')"
