name: Base image

# The dev-container base image lives in base/ and is released from the same tag as the gateway
# (docker-publish.yml builds it right after the gateway image, #235). This workflow is the
# pull-request side: a build of the image against a gateway image built from the same commit, so
# a release pull request — whose ARG names a gateway that is not published yet — can still prove
# that the base builds and holds the relay it claims. It runs for the files the image is built
# from; the shell tests of the files under base/ are base-tests.yml.
on:
  push:
    branches: [main]
    paths:
      - "base/Dockerfile"
      - "base/scripts/**"
      - "base/managed-settings.json"
      - "base/zsh-config/**"
      - "base/tests/test_image.sh"
      - "Dockerfile"
      - ".github/workflows/base.yml"
  pull_request:
    paths:
      - "base/Dockerfile"
      - "base/scripts/**"
      - "base/managed-settings.json"
      - "base/zsh-config/**"
      - "base/tests/test_image.sh"
      - "Dockerfile"
      - ".github/workflows/base.yml"
  workflow_dispatch:

jobs:
  image:
    name: The image builds and holds the relay it claims
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The gateway of this same commit. Its version is the one base/Dockerfile's ARG names,
      # published or not — that is what lets the release pull request build.
      - name: Build the gateway image (amd64)
        run: docker build -t sekimore-gw:ci .

      - name: Build the base image against it
        run: docker build -t sgw-devcontainer-base:ci --build-arg SEKIMORE_GW_IMAGE=sekimore-gw:ci base

      # The files can all agree and the image still hold the wrong relay — a COPY that names a
      # path that moved, or a stage resolving to another tag. This asks the image itself.
      - name: What the image holds
        run: base/tests/test_image.sh sgw-devcontainer-base:ci
