# Development tasks. Before pushing, run `mise run ci` to do the same checks as CI
# (relay.yml / test.yml / lint.yml) all together.
# ci runs the independent checks in parallel (mise's depends are executed concurrently). Only pytest (~35s)
# and cargo test (~10s) are slow, so they get their own lanes and the whole run takes as long as the
# slowest task (~35s).
#
#   mise run ci        # every check in parallel. Always run before pushing
#   mise run fmt       # rustfmt + ruff format, "applying" the changes (rewrites files, not --check)
#   Individually: mise run ci:rust-lint / ci:rust-test / ci:py-lint / ci:py-test / audit

[tools]
rust = "1.89.0"

[env]
SEKIMORE_E2E_REQUIRED = "1"

# ---- Rust (relay.yml) ----
[tasks."ci:rust-lint"]
description = "relay fmt --check + clippy (fast)"
dir = "{{config_root}}/relay"
run = """
set -e
cargo fmt --check
cargo clippy --all-targets --features test-hooks -- -D warnings
"""

[tasks."ci:rust-test"]
description = "relay test --locked (includes e2e, ~10s)"
dir = "{{config_root}}/relay"
run = "cargo test --features test-hooks --locked"

# ---- Python (lint.yml + test.yml) ----
[tasks."ci:py-lint"]
description = "ruff check / ruff format --check / mypy (fast)"
run = """
set -e
uv run ruff check src/ tests/
uv run ruff format --check src/ tests/
uv run mypy src/
"""

[tasks."ci:py-test"]
description = "pytest (~35s, the slowest task)"
run = 'uv run pytest -m "not e2e"'

# ---- Combined ----
[tasks.ci]
description = "all pre-push checks (runs 4 tasks in parallel)"
depends = ["ci:rust-lint", "ci:rust-test", "ci:py-lint", "ci:py-test"]

[tasks.fmt]
description = "apply formatting (rustfmt + ruff format; rewrites files)"
run = """
set -e
(cd "{{config_root}}/relay" && cargo fmt)
uv run ruff format src/ tests/
"""

[tasks.audit]
description = "cargo audit (RUSTSEC)"
dir = "{{config_root}}/relay"
run = "cargo audit"
