# 開発用タスク。push 前に `mise run ci` で CI (relay.yml / test.yml / lint.yml) と同じチェックを一括で回す。
# ci は独立チェックを並列で走らせる (mise の depends は並列実行)。重いのは pytest(~35s) と cargo test(~10s) だけ
# なので、この 2 つを別レーンにして全体を最も重いタスクの時間 (~35s) に縮める。
#
#   mise run ci        # 全チェック並列。push 前に必ず
#   mise run fmt       # rustfmt + ruff format を「適用」(--check ではなく書き換え)
#   個別: mise run ci:rust-lint / ci:rust-test / ci:py-lint / ci:py-test / audit

[tools]
rust = "1.89.0"

[env]
SEKIMORE_E2E_REQUIRED = "1"

# ---- Rust (relay.yml) ----
[tasks."ci:rust-lint"]
description = "relay の fmt --check + clippy (速い)"
dir = "{{config_root}}/relay"
run = """
set -e
cargo fmt --check
cargo clippy --all-targets --features test-hooks -- -D warnings
"""

[tasks."ci:rust-test"]
description = "relay の test --locked (e2e 込み、~10s)"
dir = "{{config_root}}/relay"
run = "cargo test --features test-hooks --locked"

# ---- Python (lint.yml + test.yml) ----
[tasks."ci:py-lint"]
description = "ruff check / ruff format --check / mypy (速い)"
run = """
set -e
uv run ruff check src/ tests/
uv run ruff format --check src/ tests/
uv run mypy src/
"""

[tasks."ci:py-test"]
description = "pytest (~35s、最も重い)"
run = 'uv run pytest -m "not e2e"'

# ---- まとめ ----
[tasks.ci]
description = "push 前の一括チェック (4 タスクを並列実行)"
depends = ["ci:rust-lint", "ci:rust-test", "ci:py-lint", "ci:py-test"]

[tasks.fmt]
description = "整形を適用する (rustfmt + ruff format。書き換え)"
run = """
set -e
(cd "{{config_root}}/relay" && cargo fmt)
uv run ruff format src/ tests/
"""

[tasks.audit]
description = "cargo audit (RUSTSEC)"
dir = "{{config_root}}/relay"
run = "cargo audit"
