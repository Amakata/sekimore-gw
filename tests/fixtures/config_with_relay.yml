# 共有 fixture: git-relay handler 有り。Python テストと relay（Rust）テストの双方が読む。
name: fixture-with-relay
allow_domains:
  - pypi.org
  - github.com
  - api.github.com
block_domains: []
ignore_domains: []
allow_ips: []
block_ips: []
proxy:
  enabled: false
  port: 3128
  upstream_proxy: null
network:
  lan_subnets: []
database_path: /data/security_gateway.db

domain_handlers:
  github.com:
    handler: git-relay
  telemetry.example.com:
    handler: deny
  static.example.com:
    handler: splice

relay:
  ssh_listen: 0.0.0.0:22
  api_listen: 0.0.0.0:8420
  https: passthrough
  state_dir: /data/relay
  token_ttl: 12h
  bootstrap: auto
  project:
    name: case-a
    repos:
      - name: LibOrg/awesome-lib
        mode: read-write
        bases: [main]
      - name: VendorOrg/reference-impl
        mode: read-only
    permissions:
      - pr:create
      - issue:create
      - project:read
