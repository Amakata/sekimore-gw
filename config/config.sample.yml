# Sekimore Gateway - AI Agent Security Gateway
# Sample Configuration File

# Gateway Display Name (shown in Web UI header)
# name: "My Security Gateway"
name: Sample | Sekimore

# Gateway Description (shown in Web UI and HTML meta)
# description: "AI agent security gateway for development"
description: Sample Sekimore Description

# Allowed Domain List
# Wildcard notation: ".example.com" allows "*.example.com", "*.*.example.com", etc.
allow_domains:
  - pypi.org
  - .pythonhosted.org
  - npmjs.com
  - .npmjs.org
  - .github.com
  - api.openai.com
  - .anthropic.com
  - deb.debian.org
  # Docker service names (for inter-container communication)
  - sekimore-gw
  - ai-agent

# Ignored Domain List (hidden from UI dashboard, but DNS resolves normally)
# Use for noisy harmless domains (telemetry, health checks, etc.)
ignore_domains: []

# Blocked Domain List
block_domains:
  - .malicious.com
  - adserver.example.com

# Allowed IP List (direct access)
# ⚠️  DO NOT include external DNS servers (e.g., 8.8.8.8)!
# This would bypass DNS filtering.
# External IPs are dynamically allowed only for DNS resolution results of allowed_domains.
allow_ips: []
  # Private networks (only if needed)
  # - 192.168.1.0/24       # Corporate network (CIDR)
  # - 10.0.0.0/8           # Private network

# Blocked IP List
block_ips:
  - 203.0.113.0/24       # Known malicious IP block

# Proxy Configuration (HTTP/HTTPS Proxy)
#
# `enabled` runs Squid inside the gateway. Turning it off stops Squid, its cache and its access
# log — DNS filtering, the firewall and the relay are separate and keep working without it.
#
# `upstream_proxy` is a different decision: it sends Squid's traffic, and the relay's own requests
# (the device flow, the GitHub API), through a corporate proxy. Set it only where one is required.
# A proxy that does not answer makes `sekimore-relay login` time out, which reads like the upstream
# being unreachable. It is read only while `enabled` is true.
#
# One timeout is worth naming, because it is not a rule in this config and widening anything
# here will not fix it: docker chooses the bridge subnets, and if the proxy's address falls
# inside one of them, the container treats the proxy as a neighbour on the bridge and never
# routes to it. The proxy logs nothing, the docker host reaches the same address fine, and the
# gateway says so at start-up. Keep docker off the site's ranges with default-address-pools in
# the daemon's /etc/docker/daemon.json:
#
#   { "default-address-pools": [ { "base": "172.31.0.0/16", "size": 24 } ] }
#
# A /16 cut into /24s gives 256 networks, which is well past what a compose stack needs.
#
# A domain listed under `domain_handlers` as github / https-relay / deny is refused by Squid
# automatically. Squid resolves names through Docker's DNS and so never sees the DNS filter's
# answers; served here, a relayed domain would stay reachable through
# `https_proxy=<gateway>:3128` and skip the relay's policy. The deny names the domain exactly,
# so a wildcard like `.github.com` keeps serving api.github.com and codeload.github.com.
proxy:
  enabled: true                           # run Squid (not: enable upstream proxying — see above)
  port: 3128                              # Proxy port
  cache_enabled: true                     # Enable cache
  cache_size_mb: 1000                     # Cache size (MB)
  upstream_proxy: null                    # corporate proxy, e.g. "proxy.example.com:8080". Leave null when there is none
  upstream_proxy_tls: false               # Use TLS for upstream proxy connection

  # Upstream proxy authentication (Basic Auth)
  # ⚠️  For security, it is recommended to use environment variables instead of writing credentials in config.yml
  # Environment variables: SEKIMORE_UPSTREAM_PROXY_USERNAME, SEKIMORE_UPSTREAM_PROXY_PASSWORD
  # If environment variables are set, the following values will be overridden
  upstream_proxy_username: null           # Upstream proxy username (env var recommended)
  upstream_proxy_password: null           # Upstream proxy password (env var recommended)

# Network Configuration
# Web UI language (0.2.4+). auto = follow the browser's Accept-Language; a choice made in the
# UI is remembered in a cookie and wins over this. Set en or ja to pin it.
# CLI tools follow the environment instead: SEKIMORE_LANG, LC_ALL, LC_MESSAGES, LANG (default en).
# Denial messages and the audit log stay English whatever this is set to.
# ui:
#   language: auto

network:
  # allowed_ports: [80, 443]     # 0.2.2+ destination TCP ports allowed to the allowed domains / IPs. Empty (the default) means every port, as before
  # LAN-side network subnets
  # IMPORTANT: For sekimore-gw, this setting is primarily informational.
  # Network detection is performed dynamically via Docker API (see orchestrator.py).
  # However, this can be used as a fallback or for static validation.
  lan_subnets:
    - "10.100.0.0/16"

# Database Path
database_path: "/data/security_gateway.db"

# ---- the relay (sekimore-relay). Omit this and the relay does not start; nothing else changes ----
# Takes git@github.com:Org/Repo.git on the relay's SSH port (22) and forwards it upstream under the
# project's policy. See relay/README.md for the details.
# domain_handlers:
#   github.com:
#     handler: github             # an exact FQDN. `git-relay` is the original name and still works
#                                 # (splice and deny work here too)
#   # ghe.example.com:            # 0.2.0+ several upstreams; each extra one listens on its own SSH port
#   #   handler: github           #   (name the upstream in repos as ghe.example.com/Org/Repo,
#   #   ssh_port: 2222            #    or list it under project.upstreams.<domain>.repos below)
#   #   ssh_options: [ProxyJump=bastion.example.com]   # 0.2.1+ passed to the upstream ssh with -o (bastion / ProxyCommand). Get the bastion's key with sekimore-relay keyscan
#   #   api_base: https://ghe.example.com/api/v3       # 0.2.1+ API base when upstream points somewhere else
#   # ghcr.io:                    # 0.2.2+ https-relay: only 443 goes through the relay's passthrough, with a per-destination upload cap
#   #   handler: https-relay
#   #   max_upload_bytes: -1      #   unlimited for a destination you push images to; omit it to use relay.https_max_upload_bytes
# relay:
#   https: passthrough            # port 443 of the same domain: passthrough | reject
#   https_max_upload_bytes: 1048576   # 0.2.2+ per-connection cap on what dev may send upstream over the 443 passthrough (an exfiltration control). -1 for unlimited
#   bootstrap: auto               # register the disposable key and issue the project token via POST /bootstrap: auto | manual
#   token_ttl: 12h
#   project:
#     name: case-a
#     repos:
#       - name: Org/Repo
#         mode: read-write        # read-only | read-write
#         bases: [main]           # branches allowed as a PR base. Direct pushes go to sekimore/* only, by default
#     # upstreams:                # 0.2.1+ a per-upstream layer between the project defaults and the repos. permissions are a diff; push/tags/delete are that upstream's defaults
#     #   ghe.example.com:
#     #     permissions: { allow: [pr:create], deny: [pr:merge] }
#     #     repos:
#     #       - { name: Corp/Internal, mode: read-write, bases: [main] }
#     permissions: [pr:create, issue:create, release:create]   # resource:action. Anything not listed is denied. {allow: [...], deny: [...]} also works
#     # boards:                 # 0.2.7+ the Projects v2 boards this project may touch. Written the way the URL reads,
#     #   - { org: acme, number: 3 }      #   github.com/orgs/acme/projects/3
#     #   - { user: someone, number: 1 }  #   github.com/users/someone/projects/1
#     # Omitted or empty refuses every Projects operation: a board's node id is opaque and says nothing
#     # about its owner, so without this list any board the upstream token can see would be reachable.
#     tags: []                                  # default globs of tags that may be pushed (empty = denied). Override per repo with repos[].tags
#     delete: false                             # default for deleting branches and tags. Override with repos[].delete
#     delete_merged_branch: false               # 0.2.9+ whether `pr merge --delete-branch` may remove the branch it
#                                               # just merged. Only that branch, so it is not the same authority as
#                                               # `delete` above. Leave it off where the forge already does this
#     # repos[] takes mode / bases / push / tags / delete / permissions ({allow, deny}, a diff against the project defaults; deny wins)
