# Sekimore Gateway - AI Agent Security Gateway
# Sample Configuration File

# Gateway Display Name (shown in Web UI header)
# name: "My Security Gateway"
name: Sample | Sekimore

# Gateway Description (shown in Web UI and HTML meta)
# description: "AI agent security gateway for development"
description: Sample Sekimore Description

# Allowed Domain List
# Wildcard notation: ".example.com" allows "*.example.com", "*.*.example.com", etc.
allow_domains:
  - pypi.org
  - .pythonhosted.org
  - npmjs.com
  - .npmjs.org
  - .github.com
  - api.openai.com
  - .anthropic.com
  - deb.debian.org
  # Docker service names (for inter-container communication)
  - sekimore-gw
  - ai-agent

# Ignored Domain List (hidden from UI dashboard, but DNS resolves normally)
# Use for noisy harmless domains (telemetry, health checks, etc.)
ignore_domains: []

# Blocked Domain List
block_domains:
  - .malicious.com
  - adserver.example.com

# Allowed IP List (direct access)
# ⚠️  DO NOT include external DNS servers (e.g., 8.8.8.8)!
# This would bypass DNS filtering.
# External IPs are dynamically allowed only for DNS resolution results of allowed_domains.
allow_ips: []
  # Private networks (only if needed)
  # - 192.168.1.0/24       # Corporate network (CIDR)
  # - 10.0.0.0/8           # Private network

# Blocked IP List
block_ips:
  - 203.0.113.0/24       # Known malicious IP block

# Proxy Configuration (HTTP/HTTPS Proxy)
proxy:
  enabled: true                           # Enable Squid proxy
  port: 3128                              # Proxy port
  cache_enabled: true                     # Enable cache
  cache_size_mb: 1000                     # Cache size (MB)
  upstream_proxy: null                    # Upstream proxy (corporate proxy integration) e.g., "proxy.example.com:8080"
  upstream_proxy_tls: false               # Use TLS for upstream proxy connection

  # Upstream proxy authentication (Basic Auth)
  # ⚠️  For security, it is recommended to use environment variables instead of writing credentials in config.yml
  # Environment variables: SEKIMORE_UPSTREAM_PROXY_USERNAME, SEKIMORE_UPSTREAM_PROXY_PASSWORD
  # If environment variables are set, the following values will be overridden
  upstream_proxy_username: null           # Upstream proxy username (env var recommended)
  upstream_proxy_password: null           # Upstream proxy password (env var recommended)

# Network Configuration
network:
  # LAN-side network subnets
  # IMPORTANT: For sekimore-gw, this setting is primarily informational.
  # Network detection is performed dynamically via Docker API (see orchestrator.py).
  # However, this can be used as a fallback or for static validation.
  lan_subnets:
    - "10.100.0.0/16"

# Database Path
database_path: "/data/security_gateway.db"

# ---- 中継関所（sekimore-relay）。省略時は relay は起動せず、既存挙動は不変 ----
# git@github.com:Org/Repo.git を関所の SSH(22) で受け、案件単位のポリシーで上流へ中継する。
# 詳細: doc/sekimore-gw/requirements/04-relay.md, doc/sekimore-gw/design/relay.md
# domain_handlers:
#   github.com:
#     handler: git-relay          # 完全一致 FQDN（splice / deny も指定可）
#   # ghe.example.com:            # 0.2.0〜 複数の上流も可。2 つ目以降は別の SSH ポートで受ける
#   #   handler: git-relay        #   (repos の name は ghe.example.com/Org/Repo で上流を明示、
#   #   ssh_port: 2222            #    または下の project.upstreams.<domain>.repos に書く)
# relay:
#   https: passthrough            # 同一ドメインの 443: passthrough | reject
#   bootstrap: auto               # 使い捨て鍵の登録 + 案件トークン発行を POST /bootstrap で自動化: auto | manual
#   token_ttl: 12h
#   project:
#     name: case-a
#     repos:
#       - name: Org/Repo
#         mode: read-write        # read-only | read-write
#         bases: [main]           # PR の base として許可するブランチ。直接 push は既定で sekimore/* のみ
#     # upstreams:                # 0.2.1〜 上流ごとの層 (案件既定と repo の間)。permissions は差分、push/tags/delete はその上流の既定
#     #   ghe.example.com:
#     #     permissions: { allow: [pr:create], deny: [pr:merge] }
#     #     repos:
#     #       - { name: Corp/Internal, mode: read-write, bases: [main] }
#     permissions: [pr:create, issue:create]   # リソース:アクション。書かないものは拒否。{allow: [...], deny: [...]} でも
#     tags: []                                  # push を許すタグ glob の既定 (空 = 拒否)。repos[].tags で repo ごとに上書き
#     delete: false                             # ブランチ / タグ削除の既定。repos[].delete で上書き
#     # repos[] には mode / bases / push / tags / delete / permissions ({allow, deny} = 案件既定への差分。deny が勝つ) を書ける
